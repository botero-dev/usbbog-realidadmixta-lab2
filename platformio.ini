; ---------------------------------------------------------------------------
;  PlatformIO Project Configuration
;  Documentación: https://docs.platformio.org/page/projectconf.html
; ---------------------------------------------------------------------------

[env:nano]
platform = atmelavr
board = nanoatmega328           ; Arduino Nano (ATmega328P, 5 V / 16 MHz)
framework = arduino
lib_deps =
    arduino-libraries/Servo@^1.3.0

; Bootloader antiguo (Optiboot a 57600). Si la placa responde a 115200,
; usar board = nanoatmega328new y borrar upload_speed.
upload_speed = 57600

; El protocolo del laboratorio es a 9600 baudios.
monitor_speed = 9600
monitor_filters = time, default

build_flags =
    -Wall
